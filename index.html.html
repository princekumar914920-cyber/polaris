    function ThreeJSTour() {
      const mountRef = useRef(null);
      const sceneRef = useRef(null);
      const rendererRef = useRef(null);
      const cameraRef = useRef(null);
      const frameRef = useRef(null);
      const controlsRef = useRef(null);
      const starsRef = useRef(null);
      const auroraRef = useRef(null);
      const blizzardRef = useRef([]);
      const hotspotMeshesRef = useRef([]);
      const tourTimerRef = useRef(null);
      const clockRef = useRef(null);

      const [mode, setMode] = useState('day'); // day | night | blizzard
      const [activeCam, setActiveCam] = useState(null);
      const [pakuSpeech, setPakuSpeech] = useState('Namaste! Main hoon Paku 🐧 Aapka polar guide! Kisi bhi hotspot ya camera angle pe click karo aur main bataunga station ke baare mein!');
      const [showSpeech, setShowSpeech] = useState(true);
      const [isTourRunning, setIsTourRunning] = useState(false);
      const [tourStep, setTourStep] = useState(0);
      const [hoveredHotspot, setHoveredHotspot] = useState(null);
      const [fps, setFps] = useState(60);

      const speakAs = useCallback((text) => {
        setPakuSpeech(text);
        setShowSpeech(true);
      }, []);

      // Build Three.js scene
      useEffect(() => {
        if (!mountRef.current) return;
        const THREE = window.THREE;
        if (!THREE) { speakAs('Three.js failed to load! Please check internet connection.'); return; }

        const W = mountRef.current.clientWidth || 800;
        const H = mountRef.current.clientHeight || 500;

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
        renderer.setSize(W, H);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        mountRef.current.appendChild(renderer.domElement);
        rendererRef.current = renderer;

        // Scene
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a1628, 0.045);
        sceneRef.current = scene;

        // Camera
        const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 300);
        camera.position.set(2, 4, 12);
        camera.lookAt(0, 0, 0);
        cameraRef.current = camera;

        // Clock
        const clock = new THREE.Clock();
        clockRef.current = clock;

        // ---- LIGHTS ----
        const ambLight = new THREE.AmbientLight(0x223355, 0.8);
        scene.add(ambLight);

        const sunLight = new THREE.DirectionalLight(0xfff5cc, 1.4);
        sunLight.position.set(20, 30, 15);
        sunLight.castShadow = true;
        sunLight.shadow.camera.far = 80;
        sunLight.shadow.mapSize.set(1024, 1024);
        scene.add(sunLight);
        scene.userData.sunLight = sunLight;
        scene.userData.ambLight = ambLight;

        // ---- TERRAIN ----
        const terrainGeo = new THREE.PlaneGeometry(60, 60, 40, 40);
        const posAttr = terrainGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
          const x = posAttr.getX(i), z = posAttr.getZ(i);
          const h = Math.sin(x * 0.3) * 0.4 + Math.cos(z * 0.25) * 0.3 + Math.sin(x * 0.6 + z * 0.4) * 0.2;
          posAttr.setY(i, h);
        }
        terrainGeo.computeVertexNormals();
        const terrainMat = new THREE.MeshLambertMaterial({ color: 0xd4eeff });
        const terrain = new THREE.Mesh(terrainGeo, terrainMat);
        terrain.rotation.x = -Math.PI / 2;
        terrain.receiveShadow = true;
        scene.add(terrain);

        // Ice surface reflection layer
        const iceGeo = new THREE.PlaneGeometry(60, 60, 1, 1);
        const iceMat = new THREE.MeshLambertMaterial({ color: 0x88ddff, transparent: true, opacity: 0.18 });
        const iceLayer = new THREE.Mesh(iceGeo, iceMat);
        iceLayer.rotation.x = -Math.PI / 2;
        iceLayer.position.y = 0.01;
        scene.add(iceLayer);

        // Snow drifts
        for (let i = 0; i < 20; i++) {
          const dGeo = new THREE.SphereGeometry(0.3 + Math.random() * 0.6, 6, 4);
          const dMat = new THREE.MeshLambertMaterial({ color: 0xe8f4ff });
          const drift = new THREE.Mesh(dGeo, dMat);
          drift.position.set((Math.random() - 0.5) * 40, 0.1, (Math.random() - 0.5) * 40);
          drift.scale.y = 0.3;
          scene.add(drift);
        }

        // ---- BHARATI STATION ----
        const bharatiGroup = new THREE.Group();
        bharatiGroup.position.set(0, 0, 0);

        // Stilts
        const stiltMat = new THREE.MeshLambertMaterial({ color: 0x445566 });
        const stiltGeo = new THREE.CylinderGeometry(0.06, 0.06, 1.2, 6);
        [[-1.2,0.6],[1.2,0.6],[-1.2,-0.6],[1.2,-0.6],[-1.2,0],[ 1.2,0]].forEach(([x,z]) => {
          const s = new THREE.Mesh(stiltGeo, stiltMat);
          s.position.set(x, 0.6, z);
          bharatiGroup.add(s);
        });

        // Main body (container modules)
        const bodyGeo = new THREE.BoxGeometry(3.5, 0.8, 1.6);
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0x1a3a5c });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.set(0, 1.6, 0);
        body.castShadow = true;
        bharatiGroup.add(body);

        // Module lines
        const modLineMat = new THREE.MeshLambertMaterial({ color: 0x00F5FF });
        for (let i = -1; i <= 1; i++) {
          const lineGeo = new THREE.BoxGeometry(0.03, 0.85, 1.65);
          const line = new THREE.Mesh(lineGeo, modLineMat);
          line.position.set(i * 1.1, 1.6, 0);
          bharatiGroup.add(line);
        }

        // Upper lab module
        const labGeo = new THREE.BoxGeometry(1.5, 0.5, 1.0);
        const labMat = new THREE.MeshLambertMaterial({ color: 0x0f2944 });
        const lab = new THREE.Mesh(labGeo, labMat);
        lab.position.set(0, 2.25, 0);
        lab.castShadow = true;
        bharatiGroup.add(lab);

        // Satellite radome (sphere)
        const radomeGeo = new THREE.SphereGeometry(0.35, 12, 8);
        const radomeMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const radome = new THREE.Mesh(radomeGeo, radomeMat);
        radome.position.set(-1.2, 2.75, 0);
        bharatiGroup.add(radome);

        // Indian flag pole
        const poleGeo = new THREE.CylinderGeometry(0.03, 0.03, 1.5, 6);
        const poleMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.set(1.5, 2.5, 0);
        bharatiGroup.add(pole);

        // Flag (orange top)
        const flagOGeo = new THREE.BoxGeometry(0.5, 0.18, 0.02);
        const flagOMat = new THREE.MeshLambertMaterial({ color: 0xff9933 });
        const flagO = new THREE.Mesh(flagOGeo, flagOMat);
        flagO.position.set(1.77, 3.08, 0);
        bharatiGroup.add(flagO);

        // Flag white
        const flagWGeo = new THREE.BoxGeometry(0.5, 0.18, 0.02);
        const flagWMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const flagW = new THREE.Mesh(flagWGeo, flagWMat);
        flagW.position.set(1.77, 2.9, 0);
        bharatiGroup.add(flagW);

        // Flag green
        const flagGGeo = new THREE.BoxGeometry(0.5, 0.18, 0.02);
        const flagGMat = new THREE.MeshLambertMaterial({ color: 0x138808 });
        const flagG = new THREE.Mesh(flagGGeo, flagGMat);
        flagG.position.set(1.77, 2.72, 0);
        bharatiGroup.add(flagG);

        // Fuel cell module (green cube)
        const fuelGeo = new THREE.BoxGeometry(0.6, 0.5, 0.5);
        const fuelMat = new THREE.MeshLambertMaterial({ color: 0x10B981 });
        const fuelCell = new THREE.Mesh(fuelGeo, fuelMat);
        fuelCell.position.set(1.5, 1.6, 0.5);
        fuelCell.userData.hotspotId = 'fuel';
        bharatiGroup.add(fuelCell);

        // Aerosol mast
        const mastGeo = new THREE.CylinderGeometry(0.04, 0.04, 2.0, 6);
        const mastMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });
        const mast = new THREE.Mesh(mastGeo, mastMat);
        mast.position.set(-1.5, 2.0, 0.2);
        mast.userData.hotspotId = 'aerosol';
        bharatiGroup.add(mast);

        // GNSS antenna
        const antennaGeo = new THREE.CylinderGeometry(0.25, 0.1, 0.15, 8);
        const antennaMat = new THREE.MeshLambertMaterial({ color: 0x00F5FF });
        const antenna = new THREE.Mesh(antennaGeo, antennaMat);
        antenna.position.set(0, 3.4, -0.6);
        antenna.userData.hotspotId = 'antenna';
        bharatiGroup.add(antenna);

        // Window glow strips
        const winMat = new THREE.MeshLambertMaterial({ color: 0xfff5aa, emissive: 0xffdd44, emissiveIntensity: 0.6 });
        for (let i = -1; i <= 1; i++) {
          const winGeo = new THREE.BoxGeometry(0.25, 0.15, 0.05);
          const win = new THREE.Mesh(winGeo, winMat);
          win.position.set(i * 0.9, 1.65, 0.83);
          bharatiGroup.add(win);
        }

        scene.add(bharatiGroup);
        scene.userData.bharatiGroup = bharatiGroup;

        // ---- MAITRI STATION ----
        const maitriGroup = new THREE.Group();
        maitriGroup.position.set(6, 0, 3);

        const mBodyGeo = new THREE.BoxGeometry(2.5, 1.0, 1.2);
        const mBodyMat = new THREE.MeshLambertMaterial({ color: 0x8B3A3A });
        const mBody = new THREE.Mesh(mBodyGeo, mBodyMat);
        mBody.position.set(0, 1.0, 0);
        mBody.castShadow = true;
        mBody.userData.hotspotId = 'maitri';
        maitriGroup.add(mBody);

        // Maitri roof
        const mRoofGeo = new THREE.CylinderGeometry(0, 1.5, 0.6, 4);
        const mRoofMat = new THREE.MeshLambertMaterial({ color: 0xaa4444 });
        const mRoof = new THREE.Mesh(mRoofGeo, mRoofMat);
        mRoof.position.set(0, 1.8, 0);
        maitriGroup.add(mRoof);

        // Maitri flag
        const mPoleGeo = new THREE.CylinderGeometry(0.03, 0.03, 1.2, 6);
        const mPole = new THREE.Mesh(mPoleGeo, poleMat);
        mPole.position.set(1.1, 2.1, 0);
        maitriGroup.add(mPole);

        const mFlagGeo = new THREE.BoxGeometry(0.45, 0.45, 0.02);
        const mFlagMat = new THREE.MeshLambertMaterial({ color: 0xff9933 });
        const mFlag = new THREE.Mesh(mFlagGeo, mFlagMat);
        mFlag.position.set(1.35, 2.45, 0);
        maitriGroup.add(mFlag);

        // MoES insignia disk
        const insigniaGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.05, 16);
        const insigniaMat = new THREE.MeshLambertMaterial({ color: 0x003399, emissive: 0x001166, emissiveIntensity: 0.5 });
        const insignia = new THREE.Mesh(insigniaGeo, insigniaMat);
        insignia.position.set(-0.5, 1.55, 0.65);
        insignia.rotation.x = -Math.PI / 2;
        maitriGroup.add(insignia);

        scene.add(maitriGroup);

        // ---- STARS ----
        const starGeo = new THREE.BufferGeometry();
        const starVerts = [];
        for (let i = 0; i < 1000; i++) {
          starVerts.push((Math.random() - 0.5) * 400, 50 + Math.random() * 100, (Math.random() - 0.5) * 400);
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3, transparent: true, opacity: 0 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);
        starsRef.current = stars;

        // ---- AURORA PLANE ----
        const auroraGeo = new THREE.PlaneGeometry(80, 30);
        const auroraMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0, side: THREE.DoubleSide });
        const aurora = new THREE.Mesh(auroraGeo, auroraMat);
        aurora.position.set(0, 35, -30);
        aurora.rotation.x = 0.3;
        scene.add(aurora);
        auroraRef.current = aurora;

        // ---- BLIZZARD PARTICLES ----
        const blizzGeo = new THREE.BufferGeometry();
        const blizzVerts = [];
        for (let i = 0; i < 800; i++) {
          blizzVerts.push((Math.random() - 0.5) * 50, Math.random() * 20, (Math.random() - 0.5) * 50);
        }
        blizzGeo.setAttribute('position', new THREE.Float32BufferAttribute(blizzVerts, 3));
        const blizzMat = new THREE.PointsMaterial({ color: 0xcceeff, size: 0.15, transparent: true, opacity: 0 });
        const blizzard = new THREE.Points(blizzGeo, blizzMat);
        scene.add(blizzard);
        blizzardRef.current = [blizzard];

        // ---- ORBIT CONTROLS (manual) ----
        let isMouseDown = false, lastMX = 0, lastMY = 0;
        let theta = 0.3, phi = 0.4, radius = 12;
        let targetTheta = theta, targetPhi = phi, targetRadius = radius;
        let targetLookAt = new THREE.Vector3(0, 0, 0);
        let currentLookAt = new THREE.Vector3(0, 0, 0);
        let isTourActiveLocal = false;

        const canvas = renderer.domElement;

        canvas.addEventListener('mousedown', (e) => { isMouseDown = true; lastMX = e.clientX; lastMY = e.clientY; isTourActiveLocal = false; });
        canvas.addEventListener('mouseup', () => { isMouseDown = false; });
        canvas.addEventListener('mousemove', (e) => {
          if (!isMouseDown) return;
          const dx = (e.clientX - lastMX) * 0.006;
          const dy = (e.clientY - lastMY) * 0.004;
          targetTheta -= dx;
          targetPhi = Math.max(0.1, Math.min(1.4, targetPhi - dy));
          lastMX = e.clientX; lastMY = e.clientY;
        });
        canvas.addEventListener('wheel', (e) => {
          targetRadius = Math.max(4, Math.min(28, targetRadius + e.deltaY * 0.018));
          isTourActiveLocal = false;
          e.preventDefault();
        }, { passive: false });

        // Touch support
        let lastTouchDist = 0;
        canvas.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) { isMouseDown = true; lastMX = e.touches[0].clientX; lastMY = e.touches[0].clientY; }
          if (e.touches.length === 2) { lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
        });
        canvas.addEventListener('touchend', () => { isMouseDown = false; });
        canvas.addEventListener('touchmove', (e) => {
          if (e.touches.length === 1 && isMouseDown) {
            const dx = (e.touches[0].clientX - lastMX) * 0.006;
            const dy = (e.touches[0].clientY - lastMY) * 0.004;
            targetTheta -= dx; targetPhi = Math.max(0.1, Math.min(1.4, targetPhi - dy));
            lastMX = e.touches[0].clientX; lastMY = e.touches[0].clientY;
          }
          if (e.touches.length === 2) {
            const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            targetRadius = Math.max(4, Math.min(28, targetRadius - (d - lastTouchDist) * 0.04));
            lastTouchDist = d;
          }
          e.preventDefault();
        }, { passive: false });

        // Hotspot click
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        canvas.addEventListener('click', (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const objects = [];
          scene.traverse(obj => { if (obj.isMesh && obj.userData.hotspotId) objects.push(obj); });
          const hits = raycaster.intersectObjects(objects, true);
          if (hits.length > 0) {
            const hsId = hits[0].object.userData.hotspotId;
            const hs = HOTSPOTS.find(h => h.id === hsId);
            if (hs) {
              setPakuSpeech('Paku: ' + hs.fact);
              setShowSpeech(true);
            }
          }
        });

        controlsRef.current = { getState: () => ({ theta, phi, radius }), goTo: (cp) => {
          isTourActiveLocal = true;
          targetTheta = Math.atan2(cp.pos.x, cp.pos.z);
          targetPhi = Math.asin(cp.pos.y / Math.sqrt(cp.pos.x**2 + cp.pos.y**2 + cp.pos.z**2));
          targetRadius = Math.sqrt(cp.pos.x**2 + cp.pos.y**2 + cp.pos.z**2);
          targetLookAt.set(cp.target.x, cp.target.y, cp.target.z);
        }};

        // ---- RENDER LOOP ----
        let frames = 0; let lastFpsTime = performance.now();
        const animate = () => {
          frameRef.current = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();

          // Smooth camera
          theta += (targetTheta - theta) * 0.06;
          phi += (targetPhi - phi) * 0.06;
          radius += (targetRadius - radius) * 0.06;
          currentLookAt.lerp(targetLookAt, 0.06);

          camera.position.set(
            currentLookAt.x + radius * Math.sin(theta) * Math.cos(phi),
            currentLookAt.y + radius * Math.sin(phi),
            currentLookAt.z + radius * Math.cos(theta) * Math.cos(phi)
          );
          camera.lookAt(currentLookAt);

          // Flag wave
          if (flagW) {
            flagW.rotation.y = Math.sin(t * 2.5) * 0.15;
            flagO.rotation.y = Math.sin(t * 2.5 + 0.2) * 0.15;
            flagG.rotation.y = Math.sin(t * 2.5 - 0.2) * 0.15;
          }

          // Blizzard movement
          if (blizzard) {
            const bPos = blizzard.geometry.attributes.position;
            for (let i = 0; i < bPos.count; i++) {
              bPos.setY(i, bPos.getY(i) - 0.12);
              bPos.setX(i, bPos.getX(i) + Math.sin(t + i) * 0.04);
              if (bPos.getY(i) < -1) bPos.setY(i, 20);
            }
            bPos.needsUpdate = true;
          }

          // Aurora wave
          if (auroraRef.current) {
            auroraRef.current.material.opacity = auroraRef.current.material.opacity > 0 ?
              0.12 + Math.sin(t * 0.5) * 0.05 : 0;
          }

          renderer.render(scene, camera);

          // FPS counter
          frames++;
          const now = performance.now();
          if (now - lastFpsTime > 2000) {
            setFps(Math.round(frames * 1000 / (now - lastFpsTime)));
            frames = 0; lastFpsTime = now;
          }
        };
        animate();

        // Resize handler
        const onResize = () => {
          if (!mountRef.current) return;
          const w = mountRef.current.clientWidth;
          const h = mountRef.current.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', onResize);

        return () => {
          window.removeEventListener('resize', onResize);
          cancelAnimationFrame(frameRef.current);
          if (tourTimerRef.current) clearTimeout(tourTimerRef.current);
          renderer.dispose();
          if (mountRef.current && renderer.domElement.parentNode === mountRef.current) {
            mountRef.current.removeChild(renderer.domElement);
          }
        };
      }, []);

      // Mode switcher
      useEffect(() => {
        const scene = sceneRef.current;
        if (!scene) return;
        const sun = scene.userData.sunLight;
        const amb = scene.userData.ambLight;
        const stars = starsRef.current;
        const aurora = auroraRef.current;
        const blizz = blizzardRef.current[0];

        if (mode === 'day') {
          if (sun) { sun.color.set(0xfff5cc); sun.intensity = 1.4; }
          if (amb) { amb.color.set(0x223355); amb.intensity = 0.8; }
          if (stars) stars.material.opacity = 0;
          if (aurora) aurora.material.opacity = 0;
          if (blizz) blizz.material.opacity = 0;
          scene.fog = new THREE.FogExp2(0x0a1628, 0.04);
        } else if (mode === 'night') {
          if (sun) { sun.color.set(0x1133aa); sun.intensity = 0.3; }
          if (amb) { amb.color.set(0x000822); amb.intensity = 0.4; }
          if (stars) stars.material.opacity = 0.9;
          if (aurora) { aurora.material.opacity = 0.15; aurora.material.color.set(0x00ff66); }
          if (blizz) blizz.material.opacity = 0;
          scene.fog = new THREE.FogExp2(0x010816, 0.05);
        } else if (mode === 'blizzard') {
          if (sun) { sun.color.set(0x8899bb); sun.intensity = 0.5; }
          if (amb) { amb.color.set(0x445566); amb.intensity = 1.2; }
          if (stars) stars.material.opacity = 0;
          if (aurora) aurora.material.opacity = 0;
          if (blizz) blizz.material.opacity = 0.8;
          scene.fog = new THREE.FogExp2(0x99bbcc, 0.12);
        }
      }, [mode]);

      // Guided tour
      const startTour = useCallback(() => {
        if (isTourRunning) return;
        setIsTourRunning(true);
        setTourStep(0);
        let step = 0;
        const doStep = () => {
          if (step >= TOUR_CHECKPOINTS.length) {
            setIsTourRunning(false);
            speakAs('Paku: Tour complete ho gaya! Mujhe bohot maza aaya! Agar koi aur question hai toh hotspot pe click karo. 🐧✨');
            return;
          }
          const cp = TOUR_CHECKPOINTS[step];
          setTourStep(step);
          if (controlsRef.current) controlsRef.current.goTo(cp);
          speakAs('Paku: ' + cp.fact);
          step++;
          tourTimerRef.current = setTimeout(doStep, 4500);
        };
        doStep();
      }, [isTourRunning, speakAs]);

      const gotoPreset = (idx) => {
        const cp = TOUR_CHECKPOINTS[idx];
        if (controlsRef.current) controlsRef.current.goTo(cp);
        setActiveCam(cp.name);
        speakAs('Paku: ' + cp.fact);
      };

      return (
        <div className="space-y-4">
          {/* Header */}
          <div className="p-5 rounded-2xl bg-[#0B1528]/90 border border-[#00F5FF]/40 shadow-xl">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
              <div>
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#00F5FF]/10 border border-[#00F5FF]/30 text-[#00F5FF] text-xs font-mono font-bold mb-2">
                  <span className="pulse">●</span> POLARIS 3D STATION EXPLORER — WebGL LIVE
                </div>
                <h2 className="text-2xl font-black text-white">POLARIS 3D Station Explorer & Walkthrough</h2>
                <p className="text-sm text-slate-400 font-mono mt-1">Interactive 3D tour of Bharati & Maitri Antarctic Stations · Guided by Paku 🐧 · Optimised for 64–128 kbps</p>
              </div>
              <div className="flex items-center gap-2 font-mono text-xs">
                <span className="px-2 py-1 rounded bg-[#10B981]/20 text-[#10B981] border border-[#10B981]/30">WebGL Active</span>
                <span className="px-2 py-1 rounded bg-[#030712] text-slate-400 border border-slate-700">{fps} FPS</span>
              </div>
            </div>
          </div>

          {/* 3D Viewport + Controls */}
          <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">

            {/* Main Viewport */}
            <div className="lg:col-span-3 relative rounded-2xl overflow-hidden border border-[#38BDF8]/30 shadow-2xl" style={{height:'520px', background:'#010d1a'}}>
              <div ref={mountRef} style={{width:'100%', height:'100%'}} />

              {/* Paku HUD */}
              <div className="absolute bottom-4 left-4 flex items-end gap-3 pointer-events-none">
                {/* Penguin SVG */}
                <div className="relative">
                  <svg viewBox="0 0 100 120" className="w-20 h-24 drop-shadow-2xl" style={{filter:'drop-shadow(0 0 8px #00F5FF66)'}}>
                    <ellipse cx="50" cy="112" rx="28" ry="6" fill="#000" opacity="0.5" />
                    <ellipse cx="37" cy="108" rx="8" ry="4" fill="#F59E0B" />
                    <ellipse cx="63" cy="108" rx="8" ry="4" fill="#F59E0B" />
                    <ellipse cx="50" cy="66" rx="28" ry="40" fill="#070F1E" stroke="#00F5FF" strokeWidth="1.5" />
                    <ellipse cx="50" cy="72" rx="18" ry="30" fill="url(#pg)" />
                    <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#FDE047"/><stop offset="60%" stopColor="#FFF"/></linearGradient></defs>
                    <circle cx="50" cy="32" r="18" fill="#070F1E" />
                    <path d="M36,26 Q30,32 36,38" stroke="#FBBF24" strokeWidth="4" fill="none" strokeLinecap="round" />
                    <path d="M64,26 Q70,32 64,38" stroke="#FBBF24" strokeWidth="4" fill="none" strokeLinecap="round" />
                    <circle cx="44" cy="30" r="3" fill="#fff" /><circle cx="45" cy="30" r="1.5" fill="#030712" />
                    <circle cx="56" cy="30" r="3" fill="#fff" /><circle cx="55" cy="30" r="1.5" fill="#030712" />
                    <polygon points="50,35 45,42 55,42" fill="#F59E0B" />
                    <path d="M25,54 Q14,68 26,80" stroke="#070F1E" strokeWidth="7" strokeLinecap="round" fill="none" />
                    <g style={{animation:'flipper 1.5s ease-in-out infinite alternate'}}>
                      <path d="M75,54 Q92,62 95,76" stroke="#070F1E" strokeWidth="8" strokeLinecap="round" fill="none" />
                      <circle cx="96" cy="78" r="7" fill="#00F5FF" />
                      <circle cx="96" cy="78" r="4" fill="#030712" />
                    </g>
                  </svg>
                  <style>{`@keyframes flipper{from{transform:rotate(-12deg)}to{transform:rotate(8deg)}}`}</style>
                </div>
                {/* Speech Bubble */}
                {showSpeech && (
                  <div className="paku-bubble pointer-events-auto max-w-xs md:max-w-sm mb-8">
                    <div className="relative px-4 py-3 rounded-2xl rounded-bl-none bg-white text-[#030712] text-xs font-mono font-bold shadow-2xl leading-relaxed">
                      {pakuSpeech}
                      <button onClick={() => setShowSpeech(false)} className="absolute -top-2 -right-2 w-5 h-5 rounded-full bg-slate-700 text-white flex items-center justify-center text-[10px] hover:bg-slate-500">✕</button>
                    </div>
                  </div>
                )}
              </div>

              {/* Mode Badges */}
              <div className="absolute top-3 right-3 flex items-center gap-2">
                {['day','night','blizzard'].map(m => (
                  <button key={m} onClick={() => { setMode(m); speakAs(m==='day'?'Paku: Clear polar day! Sun yahan 6 months tak set nahi hota! ☀️❄️':m==='night'?'Paku: Polar night! Aurora australis dekho – ye charged particles aur magnetic field ka jugalbandi hai! 🌌':"Paku: Blizzard mode! Winds 300+ km/h tak jaati hain. Station ke andar tight raho! 🌨️💨"); }}
                    className={`px-2.5 py-1.5 rounded-xl text-xs font-mono font-bold border transition-all ${ mode===m ? 'bg-[#00F5FF] text-[#030712] border-[#00F5FF] shadow-lg' : 'bg-[#030712]/80 text-slate-400 border-slate-700 hover:text-white' }`}>
                    {m==='day'?'☀️ Day':m==='night'?'🌌 Night':'🌨️ Blizzard'}
                  </button>
                ))}
              </div>

              {/* Hotspot labels overlay */}
              <div className="absolute top-3 left-3 space-y-1 pointer-events-none">
                <div className="px-2 py-1 rounded bg-[#00F5FF]/20 border border-[#00F5FF]/40 text-[10px] font-mono text-[#00F5FF]">🎯 Click hotspot objects to hear Paku!</div>
                <div className="px-2 py-1 rounded bg-[#030712]/80 border border-slate-700 text-[10px] font-mono text-slate-400">🖱️ Drag · Scroll to zoom · Touch supported</div>
              </div>

              {/* Tour Step Indicator */}
              {isTourRunning && (
                <div className="absolute bottom-4 right-4 px-3 py-2 rounded-xl bg-[#00F5FF] text-[#030712] text-xs font-mono font-black">
                  📍 Tour: {TOUR_CHECKPOINTS[tourStep]?.name} ({tourStep+1}/{TOUR_CHECKPOINTS.length})
                </div>
              )}
            </div>

            {/* Right Controls Panel */}
            <div className="lg:col-span-1 space-y-4">
              {/* Guided Tour */}
              <div className="p-4 rounded-2xl bg-[#0B1528]/90 border border-[#00F5FF]/40 space-y-3 tour-glow">
                <div className="text-xs font-mono text-[#00F5FF] font-bold uppercase tracking-wider">🐧 Guided Tour</div>
                <p className="text-[11px] text-slate-400 font-mono">Let Paku take you through all key checkpoints with live narration!</p>
                <button
                  onClick={startTour}
                  disabled={isTourRunning}
                  className={`w-full py-3 px-4 rounded-xl text-xs font-mono font-black transition-all flex items-center justify-center gap-2 ${ isTourRunning ? 'bg-[#00F5FF]/30 text-[#00F5FF] cursor-not-allowed animate-pulse' : 'bg-gradient-to-r from-[#00F5FF] to-[#38BDF8] text-[#030712] hover:opacity-90 shadow-lg shadow-[#00F5FF]/20' }`}>
                  {isTourRunning ? `🐧 Touring... (${tourStep+1}/${TOUR_CHECKPOINTS.length})` : '▶ Start Guided Tour'}
                </button>
              </div>

              {/* Preset Camera Angles */}
              <div className="p-4 rounded-2xl bg-[#0B1528]/90 border border-[#38BDF8]/30 space-y-2">
                <div className="text-xs font-mono text-[#38BDF8] font-bold uppercase tracking-wider mb-2">📷 Camera Angles</div>
                {TOUR_CHECKPOINTS.map((cp, idx) => (
                  <button key={idx} onClick={() => gotoPreset(idx)}
                    className={`w-full text-left px-3 py-2 rounded-xl text-xs font-mono border transition-all ${ activeCam===cp.name ? 'bg-[#00F5FF]/20 border-[#00F5FF] text-white font-bold' : 'bg-[#030712] border-slate-700 text-slate-400 hover:text-white hover:border-slate-500' }`}>
                    📍 {cp.name}
                  </button>
                ))}
              </div>

              {/* Hotspot Legend */}
              <div className="p-4 rounded-2xl bg-[#0B1528]/90 border border-[#38BDF8]/30 space-y-2">
                <div className="text-xs font-mono text-[#38BDF8] font-bold uppercase tracking-wider mb-2">🎯 Station Hotspots</div>
                {HOTSPOTS.map(hs => (
                  <div key={hs.id} onClick={() => speakAs('Paku: ' + hs.fact)}
                    className="px-3 py-2 rounded-xl bg-[#030712] border border-slate-700 text-xs font-mono text-slate-400 hover:text-white hover:border-[#00F5FF] cursor-pointer transition-all">
                    🏗️ {hs.label}
                  </div>
                ))}
              </div>

              {/* Mode Guide */}
              <div className="p-4 rounded-2xl bg-[#0B1528]/90 border border-[#38BDF8]/30 space-y-1 text-[11px] font-mono text-slate-400">

    /* ====================================================

    ==================================================== */
    function SnowCanvas({ active }) {
      const ref = useRef(null);
      useEffect(() => {
        const canvas = ref.current; if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let afid;
        const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        resize(); window.addEventListener('resize', resize);
        const flakes = Array.from({length:80}, () => ({ x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight, r: Math.random()*2+0.5, d: Math.random()*1.5+0.5, o: Math.random()*0.7+0.3, a: Math.random()*Math.PI*2 }));
        const draw = () => {
          ctx.clearRect(0,0,canvas.width,canvas.height);
          if (active) flakes.forEach(f => { ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fillStyle=`rgba(226,232,240,${f.o})`; ctx.fill(); f.a+=0.015; f.y+=Math.cos(f.a)+f.d; f.x+=Math.sin(f.a)*0.8+0.3; if(f.y>canvas.height){f.y=-6;f.x=Math.random()*canvas.width;} if(f.x>canvas.width)f.x=0; if(f.x<0)f.x=canvas.width; });
          afid = requestAnimationFrame(draw);
        };
        draw();
        return () => { window.removeEventListener('resize',resize); cancelAnimationFrame(afid); };
      }, [active]);
      return <canvas ref={ref} className="fixed inset-0 pointer-events-none z-10" />;
    }

                    <ellipse cx="122" cy="218" rx="16" ry="7" fill="#F59E0B" />

                    <span className="text-[#38BDF8] flex items-center gap-1.5">🛰️ Connecting to Bharati Station Sat-Net (64 kbps)...</span>
                    <span className="text-[#00F5FF] font-bold">{syncProgress}%</span>
                  </div>
                  <div className="w-full h-3 rounded-full bg-[#030712] border border-[#38BDF8]/30 overflow-hidden p-0.5">

                </div>
                <p className="text-[11px] font-mono text-slate-400">POLARIS by Phantom Coderx · Team 134551 · SIH26063</p>
